<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgraded Password Generator</title>
    <style>
        :root {
            --bg-color: #0d1417; 
            --card-bg: #162122;  
            --accent-color: #00bdc3; 
            --text-main: #c9d8d9; 
            --text-muted: #8b9d9e;
            --border-color: #303a3d;
            --radius: 12px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }

        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            padding: 30px;
        }

        .header { margin-bottom: 25px; text-align: center; }
        .header h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: -0.5px; }

        .output-box {
            background-color: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: calc(var(--radius) / 1.5);
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .password-text {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 1.1rem;
            color: var(--text-main);
            word-break: break-all;
            opacity: 0.8;
        }

        .password-text.generated { color: #fff; opacity: 1; }

        .icon-btn {
            background: none; border: none; cursor: pointer; color: var(--text-muted);
            font-size: 1.2rem; transition: color 0.2s;
        }
        .icon-btn:hover { color: var(--accent-color); }

        .settings-container { display: flex; flex-direction: column; gap: 15px; }

        .slider-group {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .slider-header {
            display: flex; justify-content: space-between;
            font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;
        }
        .slider-header span.val { color: var(--accent-color); font-weight: bold; }

        input[type="range"] { width: 100%; accent-color: var(--accent-color); cursor: pointer; }

        .setting-item {
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border-color); border-radius: 8px;
            padding: 12px 15px;
        }

        .setting-label { display: flex; flex-direction: column; }
        .setting-title { font-size: 0.95rem; font-weight: 500; }
        .setting-desc { font-size: 0.8rem; color: var(--text-muted); }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-switch {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #30363d; transition: .3s; border-radius: 24px;
        }
        .slider-switch:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider-switch { background-color: var(--accent-color); }
        input:checked + .slider-switch:before { transform: translateX(20px); }

        .generate-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .generate-btn:hover { background-color: #164f75; }
        .generate-btn:active { transform: translateY(1px); }

        #toast {
            position: fixed;
            top: 20px;
            left: calc(50vw - 100px);
            background-color: #162222;
            border: 1px solid #00acc3;
            color: #c9d9cb;
            border-radius: 8px;
            font-size: 0.9rem;
            height: 50px;
            width: 200px;
            font-size: 13px;
            display: grid;
            place-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 10000;
        }

        #toast.error{
            border-color: red;
        }

        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 401px) {
            .app-container { padding: 20px;width: 98%;}
            .header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>Password Generator</h1>
        </div>

        <div class="output-box">
            <span class="password-text" id="passwordDisplay">Generate</span>
            <button class="icon-btn" id="copyBtn" title="Kopyala">
                <small>Copy</small>
            </button>
        </div>

        <div class="settings-container">
            <div class="slider-group">
                <div class="slider-header">
                    <span>Şifrə Uzunluğu</span>
                    <span class="val" id="lengthVal">16</span>
                </div>
                <input type="range" id="lengthSlider" min="6" max="64" value="16">
            </div>

            <div class="setting-item">
                <div class="setting-label">
                    <span class="setting-title">Upper Letters</span>
                    <span class="setting-desc">A-Z</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="incUpper" checked>
                    <span class="slider-switch round"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="setting-label">
                    <span class="setting-title">Lower Letters</span>
                    <span class="setting-desc">a-z</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="incLower" checked>
                    <span class="slider-switch round"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="setting-label">
                    <span class="setting-title">Digits</span>
                    <span class="setting-desc">0-9</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="incDigits">
                    <span class="slider-switch round"></span>
                </label>
            </div>
            <div class="setting-item">
                <div class="setting-label">
                    <span class="setting-title">Symbols</span>
                    <span class="setting-desc">!@#$%^&*</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="incSymbols">
                    <span class="slider-switch round"></span>
                </label>
            </div>
        </div>

        <button class="generate-btn">CREATE NEW PASSWORD</button>
    </div>

    <div id="toast"><p id="toast-msg"></p></div>

    <script>
        const slider = document.getElementById('lengthSlider');
        const lengthVal = document.getElementById('lengthVal');
        const passwordDisplay = document.getElementById('passwordDisplay');
        const copyBtn = document.getElementById('copyBtn');
        const upper_btn=document.getElementById("incUpper")
        const lower_btn=document.getElementById("incLower")
        const digit_btn=document.getElementById("incDigits")
        const symbol_btn=document.getElementById("incSymbols")


        function showAlert(message, duration = 3000,success=true) {
            const toast = document.getElementById('toast');
            const toast_msg = document.getElementById("toast-msg")
            toast_msg.textContent = message;
            if(!success){toast.classList.add('error')}
            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
                toast.classList.remove("error")
            }, duration);
        }

        slider.addEventListener('input', (e) => {
            lengthVal.textContent = e.target.value;
        });
        async function mockGenerate() {
            if(!upper_btn.checked && !lower_btn.checked && !digit_btn.checked && !symbol_btn.checked){
                showAlert("Please select at least one option!",3000,false)
                return
            }

            const response=await fetch("/api/generate",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    password_length:parseInt(slider.value),
                    upper:upper_btn.checked,
                    lower:lower_btn.checked,
                    digit:digit_btn.checked,
                    symbol:symbol_btn.checked
                })
            })

            const data=await response.json()

            if(data.error){
                showAlert(data.error,3000,false)
                return
            }

            passwordDisplay.textContent=data.password

            passwordDisplay.classList.add('generated');
        }

        document.querySelector('.generate-btn').addEventListener('click', mockGenerate);

        copyBtn.addEventListener('click', () => {
            const text = passwordDisplay.innerText;
            if(text !== "Generate") {
                navigator.clipboard.writeText(text);
                showAlert("Password copied!")
            }
        });


    </script>
</body>
</html>
