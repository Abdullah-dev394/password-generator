<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="lockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#e6c200"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Black background -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Shackle -->
  <path d="M156 266 L156 196 C156 141 200 96 256 96 C312 96 356 141 356 196 L356 266"
        fill="none" stroke="url(#lockGrad)" stroke-width="44" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Lock body - BLACK -->
  <rect x="106" y="266" width="300" height="230" rx="40" fill="#000000" filter="url(#shadow)" stroke="#ffd700" stroke-width="20"/>

  <!-- Inner body highlight -->
  <rect x="106" y="266" width="300" height="115" rx="40" fill="#1a1a1a" opacity="0.5"/>

  <!-- Keyhole outer -->
  <circle cx="256" cy="356" r="52" fill="#1a1a2e" stroke="#ffd700" stroke-width="20"/>

  <!-- Keyhole inner circle -->
  <circle cx="256" cy="342" r="26" fill="#ffd700"/>

  <!-- Keyhole slot -->
  <path d="M240 356 L240 420 L272 420 L272 356 Z" fill="#ffd700"/>

  <!-- Shine on lock body -->
  <ellipse cx="176" cy="306" rx="50" ry="18" fill="#fff" opacity="0.1" transform="rotate(-15 176 306)"/>
</svg>